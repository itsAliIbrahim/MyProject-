<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyProject development environment" />
    <title>MyProject</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1016;
        color: #eef4f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #0b1016;
      }

      main {
        width: min(720px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid #263541;
        border-radius: 24px;
        background: #121b23;
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #74d3ae;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 530px;
        margin: 28px 0 36px;
        color: #b7c5cf;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        padding: 12px 16px;
        border: 1px solid #345547;
        border-radius: 999px;
        background: #15271f;
        color: #c8f3df;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #74d3ae;
        box-shadow: 0 0 0 5px rgb(116 211 174 / 12%);
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }

        main {
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MyProject / Alloy</p>
      <h1>Ready to build.</h1>
      <p class="intro">
        This repository now has a reproducible Docker development environment. Replace this starter with the product experience as the project takes shape.
      </p>
      <div class="status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        Development environment is running
      </div>
    </main>
  </body>
</html>
